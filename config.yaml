model:
  name: "BAAI/bge-m3"
  normalize: true
  regression: true

reranker:
  name: "BAAI/bge-reranker-v2-m3"
  top_k: 10
  threshold: 0.4

paths:
  # Directory paths are interpreted relative to the repository root.
  sasb_metrics: "metrics"
  sasb_database: "artifacts/sasb_db"
  sasb_index: "artifacts/sasb_idx"
  faiss_index: "faiss.index"      
  vector_data: "vector_data.pkl" 
  data: "data/Sustainable-VEG.json"
  ocr_output: "artifacts/ocr/olm"
  chandra_ocr_output: "artifacts/ocr/chandra"
  esg_reports_pdf: "data/reports"
  results_output: "results/{strategy}/prediction.csv"
  marked_results_output: "results/{strategy}/plots"

  train_labels: "data/train.csv"

train:
  batch_size: 8
  epochs: 3
  lr: 2e-5
  warmup_ratio: 0.1

threshold: 0.55
